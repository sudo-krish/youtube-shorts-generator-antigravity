description = "FastAPI backend for Antigravity Shorts Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.4",
    "opencv-python-headless>=4.10.0",
    "ffmpeg-python>=0.2.0",
    "whisperx>=3.1.1",
    "scipy>=1.13.1",
    "numpy>=1.26.4",
    "librosa",
    "python-dotenv>=1.2.2",
    "easyocr>=1.7.2",
    "demucs>=4.0.1",
    "tenacity>=9.1.4",
    "openai>=2.41.1",
    "onnxruntime>=1.26.0",
    "huggingface-hub>=0.36.2",
    "tokenizers>=0.22.2",
    "transformers>=4.57.6",
    "soundfile>=0.13.1",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "accelerate>=1.14.0",
    "torchcodec>=0.7.0",
    "qwen-vl-utils>=0.0.14",
]


